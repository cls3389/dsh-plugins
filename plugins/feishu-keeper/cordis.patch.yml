# 进程保活配置；bin=dsh 表示使用 PATH 中的命令，也可改为入口脚本绝对路径。
- insert:
    - id: feishu-keeper
      name: '@dsh-friends/feishu-keeper'
      config:
        enabled: true
        intervalMs: 60000
        restartBackoffMs: 10000
        restartBackoffMaxMs: 300000
        bin: dsh
        profile: feishu
        logFile: /data/dsh/feishu-lark.log
        exitFile: /data/dsh/feishu-process.exit
        keeperLog: /data/dsh/feishu-keeper.log
        home: /data/dsh/home
        dshHome: /data/dsh
