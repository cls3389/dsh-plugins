# 完整插件配置：安装后按本机服务地址修改；密钥留空走 tokenFile 引用。
# 2026-11-02 起本插件只是薄壳：行情/盯盘业务全部在 ths-data-hub(127.0.0.1:17896)。
# 不再含 FQGate/THS 协议、本地盯盘引擎、xiadan 配置——那些只属于中心。
- insert:
    - id: market-data
      name: '@dsh-friends/market-data'
      config:
        # 数据中心（行情工具唯一后端；多用户时按 usersFile 条目覆盖）
        dataCenterBaseUrl: http://127.0.0.1:17896
        dataCenterApiKey: ''
        dataCenterApiKeyFile: ''
        # 盯盘：同一中心进程，插件仅作 HTTP 客户端
        watchEnabled: false
        watchServiceBaseUrl: http://127.0.0.1:17896
        watchServiceToken: ''
        watchServiceTokenFile: ''
        # 唤醒桥（仅承载飞书 agent registry 的身份开启；监听 loopback）
        watchWakeBridgeEnabled: false
        watchWakeBridgePort: 17921
        requestTimeoutMs: 15000
        # 工具面过滤：deny 优先；allow 为空表示不过滤。
        toolDeny: []
        toolAllow: []
