# 完整可见配置；Token 使用 credentials refs，不写明文。私网访问默认关闭，确有需要再开启。
- insert:
    - id: browser-tools
      name: '@dsh-friends/browser-tools'
      config:
        baseUrl: http://127.0.0.1:18090
        apiToken: ''
        apiTokenRef: BROWSER_GATEWAY_TOKEN
        requestTimeoutMs: 190000
        allowPrivateNetworks: false
        maxResponseBytes: 10485760
        maxScreenshotBytes: 20971520
