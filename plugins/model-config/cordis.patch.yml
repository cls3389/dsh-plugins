# 模型配置审计路径与目录策略；policyFile/catalogCachePath 留空时使用包内或 DSH_HOME 默认位置。
- insert:
    - id: model-config
      name: '@dsh-friends/model-config'
      config:
        profilePath: /data/dsh/cordis.patch.yml
        catalogUrl: https://openrouter.ai/api/v1/models
        policyFile: ''
        requestTimeoutMs: 45000
        userAgent: '@dsh-friends/model-config/0.4.2'
        catalogCachePath: ''
        catalogCacheTtlMs: .inf
        catalogFillMissing: true
