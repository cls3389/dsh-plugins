# 进程保活配置；bin=dsh 表示使用 PATH 中的命令，也可改为入口脚本绝对路径。
- insert:
    - id: ops-guard
      name: '@dsh-friends/ops-guard'
      config:
        enabled: true
        intervalMs: 60000
        restartBackoffMs: 10000
        restartBackoffMaxMs: 300000
        bin: dsh
        # 拆分后默认三件套;巡检发现外部实例(systemd/手动)让位,仅二线救援。
        profiles:
          - owner
          - companion
          - guests
        logFile: /data/dsh/feishu-lark.log
        exitFile: /data/dsh/feishu-process.exit
        keeperLog: /data/dsh/ops-guard.log
        home: /data/dsh/home
        dshHome: /data/dsh
